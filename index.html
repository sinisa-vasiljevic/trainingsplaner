<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075c2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trainingsplan"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>Trainingsplan Fußball</title></head><body>
<div id="toast" class="toast" aria-live="polite"></div>
<section id="loginView" class="login-shell"><div class="login-card"><img src="icon-192.png" class="login-icon" alt="Trainingsplan Icon"><h1>Trainingsplan</h1><p>Fußball</p><form id="loginForm"><label>E-Mail<input id="loginEmail" type="email" autocomplete="email" required></label><label>Passwort<input id="loginPassword" type="password" autocomplete="current-password" required minlength="6"></label><button class="primary" type="submit">Anmelden</button></form><button id="registerBtn" class="secondary" type="button">Erstzugang mit Einladungscode</button><button id="resetBtn" class="link-btn" type="button">Passwort zurücksetzen</button></div></section>
<div id="appView" class="app hidden"><header class="app-header"><div class="brand"><img src="icon-192.png" alt=""><div><strong id="appTitle">Trainingsplan</strong><small id="roleLabel"></small></div></div><button id="logoutBtn" class="icon-btn hidden" type="button" title="Abmelden" aria-hidden="true" tabindex="-1">↪</button></header><main><section class="toolbar card"><div id="masterPlanControl" class="hidden"><label>Aktiver Plan<select id="planSelect"></select></label></div><div id="viewerPlanName" class="active-plan-name"></div><div class="segmented"><button id="weekBtn" class="active">Woche</button><button id="dayBtn">Tag</button></div></section><section id="weekView" class="schedule"></section><section id="dayView" class="schedule hidden"></section><section id="whatsappView" class="card hidden"></section><section id="adminView" class="hidden"></section></main><nav class="bottom-nav"><button data-page="schedule" class="active"><span>▦</span>Plan</button><button data-page="whatsapp"><span>◉</span>WhatsApp</button><button data-page="admin" id="adminNav" class="hidden"><span>⚙</span>Verwalten</button></nav></div>
<dialog id="registerDialog"><form id="registerForm" method="dialog"><h2>Erstzugang einrichten</h2><label>Einladungscode<input id="registerCode" required maxlength="12" autocomplete="one-time-code"></label><label>E-Mail<input id="registerEmail" type="email" required autocomplete="email"></label><label>Eigenes Passwort<input id="registerPassword" type="password" required minlength="6" autocomplete="new-password"></label><div class="dialog-actions"><button type="button" data-close class="secondary">Abbrechen</button><button type="submit" class="primary">Konto einrichten</button></div></form></dialog>
<dialog id="editDialog"><form id="editForm" method="dialog"><h2 id="editTitle">Training bearbeiten</h2><input id="sessionId" type="hidden"><label>Wochentag<select id="weekdayInput" required></select></label><label>Team<select id="teamInput" required></select></label><div class="two-col"><label>Von<input id="startInput" type="time" required></label><label>Bis<input id="endInput" type="time" required></label></div><label>Platz<select id="pitchInput" required></select></label><label>Seite<select id="sideInput" required></select></label><label>Kabine<select id="cabinInput" required></select></label><div class="dialog-actions"><button id="deleteSessionBtn" type="button" class="danger">Löschen</button><button type="button" data-close class="secondary">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form></dialog>
<dialog id="masterDataDialog"><form id="masterDataForm" method="dialog"><h2 id="masterDataTitle">Eintrag</h2><input id="masterDataCollection" type="hidden"><input id="masterDataId" type="hidden"><label>Name<input id="masterDataName" required maxlength="60"></label><label id="shortNameWrap">Kurzname<input id="masterDataShortName" maxlength="15"></label><label id="colorWrap">Farbe<input id="masterDataColor" type="color" value="#16853f"></label><label class="check"><input id="masterDataActive" type="checkbox" checked> Aktiv</label><div class="dialog-actions"><button type="button" data-close class="secondary">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form></dialog>
<dialog id="inviteDialog"><form id="inviteForm" method="dialog"><h2>Benutzer einladen</h2><label>Name<input id="inviteName" required maxlength="60"></label><label>E-Mail<input id="inviteEmail" type="email" required></label><p>Nach dem Speichern erhältst du einen Einladungscode zum Weitergeben.</p><div class="dialog-actions"><button type="button" data-close class="secondary">Abbrechen</button><button type="submit" class="primary">Einladung erstellen</button></div></form></dialog>
<script src="config.js"></script><script type="module" src="app.js"></script></body></html>
